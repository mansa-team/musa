scraper:
  years: 2003-2026
  max_workers: 8

dapt:
  chunk_size: 8192
  overlap: 200
  min_length: 400
  tokenizer: answerdotai/ModernBERT-base
  seed: 42
  token_target: 250M

paths:
  data_dir: ./data
  output_dir: ./data/output
  corpus: ./data/output/corpus.txt

audit:
  corpus: ./data/output
  benchmark: null
  threshold: 0.85
  shingle: 3
  output: ./data/output/audit.json

logging:
  level: INFO
  file: ./data/output/logun.log
